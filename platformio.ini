; MiniMotoNav - ESP32-S3 N16R8 + ILI9341 320x240
; Build:  pio run -e esp32s3
; Upload: pio run -e esp32s3 -t upload
;
; The simulator (sim/) is excluded; only the shared UI + this target are compiled.
; Pins live in include/User_Setup.h so TFT_eSPI and the firmware share one file.

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
; N16R8 = 16 MB QIO flash + 8 MB OPI PSRAM (octal).
board_build.arduino.memory_type = qio_opi

lib_deps =
    lvgl/lvgl@9.3.0
    bodmer/TFT_eSPI@^2.5.34

build_src_filter =
    +<*>
    -<sim/>
    -<tests/>

lib_ldf_mode = deep+

build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    ; LVGL's Kconfig shim pulls in esp_attr.h; assembly units do not get the
    ; ESP-IDF include list, so use sdkconfig.h directly (it is on the AS path).
    -DLV_CONF_KCONFIG_EXTERNAL_INCLUDE='"sdkconfig.h"'
    -Iinclude
    -I.
    -DUSER_SETUP_LOADED=1
    -include include/User_Setup.h
    -O2
    -ffast-math
